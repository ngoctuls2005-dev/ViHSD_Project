[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vihsd-project"
version = "0.1.0"
description = "Cong cu EDA va tien xu ly cho bai tap ViHSD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "pyvi>=0.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
